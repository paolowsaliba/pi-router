#!/usr/sbin/nft -f
# pirouter firewall
# eth0  = WAN (wall jack)
# wlan0 = amenity wifi (untrusted, backup internet)
# eth1  = LAN (USB adapter, 192.168.50.0/24)

flush ruleset

table inet filter {

  flowtable ft {
    hook ingress priority filter
    devices = { eth0, eth1 }
  }

  chain input {
    type filter hook input priority filter; policy drop;

    iifname "lo" accept
    ct state established,related accept
    ct state invalid drop

    # DHCP replies to the Pi's own WAN and wifi clients
    iifname { "eth0", "wlan0" } udp sport 67 udp dport 68 accept
    iifname { "eth0", "wlan0" } udp sport 547 udp dport 546 accept

    # IPv6 basics so the upstream links keep working
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
    icmpv6 type { packet-too-big, destination-unreachable, time-exceeded, parameter-problem } accept

    # Router services, LAN only
    iifname "eth1" tcp dport 22 accept
    iifname "eth1" udp dport { 53, 67 } accept
    iifname "eth1" tcp dport 53 accept
    iifname "eth1" icmp type echo-request accept
    iifname "eth1" tcp dport { 80, 443 } accept
    iifname "tailscale0" tcp dport { 22, 80, 443 } accept
    iifname "tailscale0" udp dport 53 accept
    iifname "tailscale0" icmp type echo-request accept
    iifname "eth0" udp dport 41641 accept

    counter comment "input dropped"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    ct state invalid drop
    meta l4proto { tcp, udp } ct state established flow add @ft
    ct state established,related accept

    # Tailscale in and out of the LAN
    iifname "tailscale0" oifname "eth1" accept
    iifname "eth1" oifname "tailscale0" accept

    # LAN out to the internet
    iifname "eth1" oifname { "eth0", "wlan0" } accept

    counter comment "forward dropped"
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

table inet nat {
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    iifname "eth1" ip daddr != 192.168.50.1 udp dport 53 redirect to :53
    iifname "eth1" ip daddr != 192.168.50.1 tcp dport 53 redirect to :53
  }
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname { "eth0", "wlan0" } ip saddr 192.168.50.0/24 masquerade
  }
}
