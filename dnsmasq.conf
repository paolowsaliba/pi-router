# dnsmasq configuration for the Pi router
# LAN side only. Serves DHCP and caching DNS to 192.168.50.0/24.

# Listen on the LAN interface only.
# Without bind-interfaces, dnsmasq would offer DHCP on every interface
# including the WAN, which would mean handing out leases on the upstream
# network.
interface=eth1
bind-interfaces

# Address pool. Router is .1, clients get .100 through .200.
# .2 to .99 is left free for manual assignments.
dhcp-range=192.168.50.100,192.168.50.200,24h

# Option 3 = default gateway, option 6 = DNS server. Both point at the Pi.
# These two are what make client devices actually route through the router.
dhcp-option=3,192.168.50.1
dhcp-option=6,192.168.50.1

# Upstream resolvers for anything not in the cache.
server=1.1.1.1
server=8.8.8.8

# Ignore /etc/resolv.conf and use only the servers above.
# Without this, dnsmasq picks up the DNS server that wlan0 received from the
# amenity network's DHCP and adds it as a third upstream, so some queries
# would leave through the building's resolver.
no-resolv

# Answer repeat lookups locally.
cache-size=1000

# Reject upstream answers that map public names to private addresses.
stop-dns-rebind
rebind-localhost-ok
